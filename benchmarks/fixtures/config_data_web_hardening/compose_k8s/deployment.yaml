apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  template:
    spec:
      containers:
        - name: api
          image: local/api:dev
          envFrom:
            - configMapRef:
                name: orders-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
data:
  ORDER_TOPIC: orders.created
