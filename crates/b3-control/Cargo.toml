[package]
name = "b3-control"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "b3-control-server"
path = "src/main.rs"

[dependencies]
b3-core = { path = "../b3-core" }
b3-embeddings = { path = "../b3-embeddings" }
b3-git = { path = "../b3-git" }
b3-indexer = { path = "../b3-indexer" }
b3-mcp-runtime = { path = "../b3-mcp-runtime" }
b3-query = { path = "../b3-query" }
b3-storage = { path = "../b3-storage" }
axum = "0.7"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
