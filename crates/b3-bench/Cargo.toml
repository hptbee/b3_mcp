[package]
name = "b3-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "b3-bench"
path = "src/main.rs"

[dependencies]
b3-compaction = { path = "../b3-compaction" }
b3-control = { path = "../b3-control" }
b3-core = { path = "../b3-core" }
b3-indexer = { path = "../b3-indexer" }
b3-mcp-runtime = { path = "../b3-mcp-runtime" }
b3-query = { path = "../b3-query" }
b3-storage = { path = "../b3-storage" }
axum = "0.7"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
