[package]
name = "b3-indexer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
b3-core = { path = "../b3-core" }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

[[bin]]
name = "b3-parser-worker"
path = "src/bin/b3-parser-worker.rs"

[lints]
workspace = true
